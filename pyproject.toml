[project]
name = "traffic-system"
version = "1.0.0"
description = "Sistema de Semáforos Inteligentes con Aprendizaje por Refuerzo (DQN)"
authors = [
    {name = "Facundo-Guarnier", email = "fj.guarnier@alumno.um.edu.ar"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = ["traffic-control", "reinforcement-learning", "dqn", "sumo", "yolo"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Configuración de Poetry
[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
requests = ">=2.31.0"
pyyaml = ">=6.0"
flask = ">=2.3.0"
numpy = ">=1.24.0,<2.0"
opencv-python = ">=4.8.0"
pillow = ">=10.0.0"
matplotlib = ">=3.7.0"
pydantic = "^2.11.7"

# TensorFlow con soporte GPU específico por plataforma
tensorflow = [
    {version = "==2.19.0", markers = "platform_system == 'Windows'"},
    {version = "==2.19.0", extras = ["and-cuda"], markers = "platform_system == 'Linux'"}
]
# Nota: Linux usa tensorflow[and-cuda] para soporte GPU NVIDIA automático
# Windows usa tensorflow estándar (sin GPU para evitar configuraciones complejas)
psutil = "^7.0.0"
pandas = "^2.3.1"
scipy = "^1.16.0"
supervision = "^0.26.1"
ultralytics = "^8.3.177"
streamlit = "^1.28.0"
streamlit-autorefresh = "^1.0.1"

[tool.poetry.group.dev.dependencies]
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"
pre-commit = "4.2.0"
types-PyYAML = "*"
types-requests = "*"
types-Pillow = "*"
types-Flask = "*"

# Configuración de Black
[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directorios a excluir
  __pycache__
  | \.git
  | \.venv
  | assets
  | docs
)/
'''

# Configuración de Ruff
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (reemplaza isort standalone)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

# Configuración de imports compatible con Black
[tool.ruff.lint.isort]
known-first-party = ["src"]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# Configuración de MyPy
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false  # Detectar imports problemáticos
warn_unused_configs = true # Advertir sobre configuraciones no utilizadas
show_error_codes = true # Mostrar códigos de error
# TODO: Activar y hacer las correcciones pertinentes
disallow_untyped_defs = true # Desalentar funciones sin anotaciones de tipo
warn_return_any = true # Advertir sobre funciones que retornan Any
strict_optional = true # Habilitar comprobaciones estrictas de tipos opcionales

# Ignorar imports de librerías externas que no tienen tipos
[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "tensorflow.*",
    "pandas.*",
    "matplotlib.*",
    "scipy.*",
    "psutil.*",
    "traci.*",
    "sumolib.*",
    "yaml.*",
    "supervision.*",
    "ultralytics.*",
    "flask.*",
    "pydantic.*",
    "numpy.*"
]
ignore_missing_imports = true

# Ignorar errores en algoritmos de Machine Learning (SARSA)
[[tool.mypy.overrides]]
module = "src.traffic_system.decision.SARSA.*"
ignore_errors = true

# Ignorar errores de retorno Any en archivos que usan bibliotecas externas como Pydantic
[[tool.mypy.overrides]]
module = "src.traffic_system.api_client.*"
warn_return_any = false

# Configuración por módulos específicos
[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true
