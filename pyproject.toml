[project]
name = "traffic-system"
version = "1.0.0"
description = "Sistema de Semáforos Inteligentes con Aprendizaje por Refuerzo (DQN)"
authors = [
    {name = "Facundo-Guarnier", email = "fj.guarnier@alumno.um.edu.ar"}
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["traffic-control", "reinforcement-learning", "dqn", "sumo", "yolo"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Configuración de Poetry
[tool.poetry]
name = "traffic-system"
version = "1.0.0"
description = "Sistema de Semáforos Inteligentes con Aprendizaje por Refuerzo (DQN)"
authors = ["Facundo-Guarnier <fj.guarnier@alumno.um.edu.ar>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
requests = ">=2.31.0"
pyyaml = ">=6.0"
flask = ">=2.3.0"
numpy = ">=1.24.0"
opencv-python = ">=4.8.0"
pillow = ">=10.0.0"
matplotlib = ">=3.7.0"
tensorflow = ">=2.13.0"

[tool.poetry.group.dev.dependencies]
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"
pre-commit = "4.2.0"
types-PyYAML = "*"
types-requests = "*"
types-Pillow = "*"

# Configuración de Black
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directorios a excluir
  __pycache__
  | \.git
  | \.venv
  | assets
  | docs
)/
'''

# Configuración de Ruff
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (reemplaza isort standalone)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

# Configuración de imports compatible con Black
[tool.ruff.lint.isort]
known-first-party = ["src"]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# Configuración de MyPy
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
