# Configuración de pre-commit para el proyecto de Semáforos Inteligentes
# Ver: https://pre-commit.com/

repos:
  # Hooks básicos de pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: ✂️  Eliminar espacios al final de línea
      - id: end-of-file-fixer
        name: 📄 Asegurar nueva línea al final de archivos
      - id: check-yaml
        name: 🔍 Validar archivos YAML
      - id: check-added-large-files
        name: 📦 Verificar archivos grandes
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
        name: 🔀 Verificar marcadores de merge conflict
      - id: debug-statements
        name: 🐛 Detectar declaraciones de debug en Python

  - repo: local
    hooks:
      # Ruff - Linter rápido con import sorting integrado
      - id: ruff
        name: ⚡ Ruff - Linter + Import sorting
        entry: poetry run ruff check
        language: system
        types: [python]
        args: [--fix, --exit-non-zero-on-fix]
        require_serial: false

      # Black - Formateo de código
      - id: black
        name: ⚫ Black - Formateo de código
        entry: poetry run black
        language: system
        types: [python]
        args: [--line-length=88]
        require_serial: false

      # MyPy - Verificación de tipos
      - id: mypy
        name: 🔍 MyPy - Verificación de tipos
        entry: poetry run mypy
        language: system
        types: [python]
        args: [--config-file=pyproject.toml, --no-error-summary]
        require_serial: true

# Configuración global
default_language_version:
  python: python3

# Archivos a excluir globalmente
exclude: |
  (?x)^(
    __pycache__/.*|
    .*\.pyc$|
    assets/.*|
    docs/.*\.md$
  )$
